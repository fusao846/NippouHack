<link rel="stylesheet" type="text/css" href="style.css">
<link rel="icon" href="image/favicon.ico" type="image/x-icon">
<table width="100%" cellspacing="0" cellpadding="0">
  <tbody>
    <tr>
      <td class="tborder">
        <table width="100%" cellspacing="0" cellpadding="0">
          <tbody>
            <tr>
              <td class="title">今日もお疲れさまでした</td>
              <td class=" version">version 1.00</td>
              <td class="title" align="right"><img src="image/gear.png" class="gear" onClick="editSettings()" /></td>
            </tr>
          </tbody>
        </table>
      </td>
    </tr>

</table>
<div id="dateList" style="display:flex; margin:10px;">Loading....</div>
<div id="projectChips" style="display:flex;margin:5px;flex-wrap:wrap;"></div>
<div id="nippouList"></div>

<pre>
</pre>
<script src="https://cdn.jsdelivr.net/npm/decimal.js"></script>
<script>
  // TODO
  // ログイン失敗時に、settings.jsonを開き、編集後、再起動を促す
  let selectedDate = null;
  let dateButtons = [];
  let nippous = [];
  let CHIPS = [];
  let settings = null;
  let projectListData = [];
  document.body.style.cursor = "progress";

  const PROJECT_CHIPS_KEY = 'ProjectChipsKey';

  window.api.onInitDates(async (stats, _settings, dates, _projectListData) => {
    console.log('●onInitDates', stats, _settings, dates, _projectListData);
    projectListData = _projectListData;
    settings = _settings;
    if (stats.status === 'ERROR_NETWORK') {
      alert(stats.message);
      const res = await window.api.submitWork({ action: 'close' });
    }
    if (stats.status === 'ERROR_LOGIN') {
      alert(stats.message);
      await window.api.submitWork({ action: 'editSettings' });
      alert('設定ファイルが変更されました。\n再度ログインを試みます。');
      await window.api.submitWork({ action: 'init' });
    }

    await new Promise(requestAnimationFrame);

    const container = document.getElementById('dateList');
    container.innerHTML = "";

    dates.forEach((date, index) => {

      const md = date.slice(5);

      const dateButton = document.createElement("div");
      dateButton.innerText = md;
      dateButton.className = "date_btn " + (index === 0 ? "date_btn_selected" : "date_btn_not_selected");
      container.appendChild(dateButton);
      dateButtons.push(dateButton);
      dateButton.addEventListener("click", () => {
        if (dateButton.classList.contains('date_btn_diabled')) return;
        selectedDate = date;
        dateButtons.forEach(btn => btn.classList.remove("date_btn_selected"));
        dateButtons.forEach(btn => btn.classList.add("date_btn_not_selected"));
        dateButton.classList.add("date_btn_selected");
        //document.getElementById('main').style.display = 'block';
      });
    });
    selectedDate = dates[0];


    CHIPS = await window.api.get(PROJECT_CHIPS_KEY);
    if (!CHIPS) {
      CHIPS = [];
    }
    console.log('●CHIPS', CHIPS);
    displayChips();
    makeNippouList();
    document.body.style.cursor = "default";
  });

  const makeProjectSelect = (projectList) => {
    const projectListSelect = document.createElement('select');
    projectListSelect.id = "projectListSelect";
    projectListSelect.className = "project_list_select";
    projectListSelect.addEventListener('change', (e) => {
      if (e.target.value === '') return;
      const codes = e.target.value.split('-');
      const names = e.target.options[e.target.selectedIndex].text.split('-');
      const exists = nippous.some(item =>
        item.projectCode === codes[0] && item.processCode === codes[1]
      )
      if (exists) return;
      const isExist = nippous.filter((n) => {
        return (n.projectCode == codes[0] && n.processCode == codes[1]);
      });
      if (isExist.length > 0) return;
      nippous.push({
        projectCode: codes[0],
        projectName: names[0],
        processCode: codes[1],
        processName: names[1],
        hour: 0.5
      });
      makeNippouList();
    });
    console.log("●projectListData:", projectListData.length);
    const blank = document.createElement('option');
    blank.value = '';
    blank.text = '選択してください';
    projectListSelect.appendChild(blank);

    projectListData.forEach(project => {
      project.processList.forEach(process => {
        const option = document.createElement('option');
        option.value = project.projectCode + "-" + process.processCode;
        option.text = project.projectName + "-" + process.processName;
        projectListSelect.appendChild(option);
      });
    });
    projectList.appendChild(projectListSelect);

  }

  const displayChips = () => {
    const projectChips = document.getElementById('projectChips');
    projectChips.innerHTML = "";

    const priorityWords = settings.project_sort_order;

    const getRank = (name) => {
      const idx = priorityWords.findIndex(w => name.includes(w));
      return idx === -1 ? priorityWords.length : idx;
    };

    CHIPS.sort((a, b) => {
      const rankDiff = getRank(a.projectName) - getRank(b.projectName);
      if (rankDiff !== 0) return rankDiff;
      if (a.projectCode != b.projectCode) return a.projectCode.localeCompare(b.projectCode, "ja");
      if (a.processCode != b.processCode) return a.processCode.localeCompare(b.processCode, "ja");
      const da = new Decimal(a.hour);
      const db = new Decimal(b.hour);
      return da.lessThan(db) ? -1 : 1;
    });

    for (const chip of CHIPS) {
      const chipEle = createProjectChip(
        chip.projectCode,
        chip.projectName,
        chip.processCode,
        chip.processName,
        chip.hour
      );
      projectChips.appendChild(chipEle);
    }
  }

  const makeNippouList = () => {
    let html = '<table class="t1" style="margin:10px;width:98%;">';
    html += '<tr><th width=30px>削</th><th width="80%">タスク</th><th>時間</th><th>調整</th></tr>';
    let idx = 0;
    let totalHour = new Decimal(0);
    nippous.forEach(nippou => {
      const select = makeHourSelect(`sel-${idx}`, new Decimal(nippou.hour));
      html += `<tr>
              <td align="center"><img src="image/trash.png" onClick=deleteNippou(${idx}) class="batsu" style="margin:0" /></div></td>
              <td>${nippou.projectName}-${nippou.processName}</td><td>${select}</td>
              <td align="center"><img src="image/time.png" onClick=adjustRemain(${idx}) class="pm" /></td>
              </tr>`;
      idx++;
      totalHour = totalHour.plus(nippou.hour);
    });
    html += `<tr><td></td><td><div id="projectList"></div></td><td></dt><td></td></tr>`;
    html += `<tr><td colspan=2>合計</td><td align="center">${totalHour.toFixed(1)}</td><td></td></tr>`;
    html += `<tr><td colspan=5 align="center"><button onClick=submit() style="height:40px;width:100px;font-size:16px;">送信</button></tr>`;
    html += '</table>';
    const nippouList = document.getElementById('nippouList');
    nippouList.innerHTML = html;
    makeProjectSelect(document.getElementById('projectList'));
  }
  const deleteNippou = (idx) => {
    nippous.splice(idx, 1);
    makeNippouList();
  }
  const adjustRemain = (idx) => {
    let total = new Decimal(0);
    for (let i = 0; i < nippous.length; i++) {
      if (i != idx) {
        total = total.plus(nippous[i].hour);
      }
    }
    const remain = new Decimal(8).minus(total);
    nippous[idx].hour = remain.toFixed(1);
    makeNippouList();
  }
  const makeHourSelect = (id, defaultHour) => {
    let html = `<select id="${id}" onChange="hourSelect(this)" style="width:100%;height:40px;font-size:24px;">`;
    let selected = '';
    for (let h = new Decimal(0); h.lessThanOrEqualTo(8); h = h.plus('0.5')) {
      selected = h.equals(defaultHour) ? ' selected ' : '';
      let hStr = h.toFixed(1);
      html += `<option value="${hStr}" ${selected}>${hStr}</option>`;
    }

    html += '</select>';
    return html;
  }
  const hourSelect = (ele) => {
    console.log('●ele', ele.id, ele.value);
    const idx = parseInt(ele.id.split('-')[1]);
    nippous[idx].hour = ele.value;
    makeNippouList();
  }

  const createProjectChip = (projectCode, projectName, processCode, processName, defaultHour) => {
    const chip = document.createElement("div");
    chip.className = "project_chip";
    const label = document.createElement("div");
    chip.appendChild(label);
    let bg = "#9f9fff";
    for (const colors of settings.project_colors) {
      if (projectName.indexOf(colors.name) >= 0) {
        bg = colors.color;
        break;
      }
    }
    chip.style.background = bg;
    label.innerHTML = `${projectName} - ${processName}<span style="font-size: 28px; font-weight: bold; color: #f00;margin-left: 10px;">${defaultHour}</span></div>`;
    chip.id = `${projectCode}|${processCode}|${defaultHour}`;
    label.addEventListener("click", () => {
      const exists = nippous.some(item =>
        item.projectCode === projectCode && item.processCode === processCode
      );
      if (exists) return;
      nippous.push({
        projectCode: projectCode,
        projectName: projectName,
        processCode: processCode,
        processName: processName,
        hour: defaultHour
      });
      makeNippouList();
    });
    const trash = document.createElement("img");
    trash.src = "image/trash.png";
    trash.className = "batsu";
    trash.addEventListener("click", () => {
      handleDelete(projectCode, processCode, defaultHour);
    });

    chip.appendChild(trash);
    return chip;
  };
  const handleDelete = async (projectCode, processCode, defaultHour) => {
    const chipId = `${projectCode}|${processCode}|${defaultHour}`;
    const chip = document.getElementById(chipId);
    if (chip) {
      chip.remove();
    }
    const index = CHIPS.findIndex(item =>
      item.projectCode === projectCode &&
      item.processCode === processCode &&
      item.hour === defaultHour
    );
    if (index >= 0) {
      CHIPS.splice(index, 1);
    }
    await window.api.set(PROJECT_CHIPS_KEY, CHIPS);
  };
  // ✅ 送信ボタン
  function submit() {
    if (!selectedDate) {
      alert("日付選択なし");
      return;
    }
    const tasks = {
      date: selectedDate,
      tasks: []
    };
    nippous.forEach(nippou => {
      tasks.tasks.push({
        projectCode: nippou.projectCode,
        processCode: nippou.processCode,
        projectName: nippou.projectName,
        processName: nippou.processName,
        hour: new Decimal(nippou.hour).toFixed(1)
      });
    });

    async function submitWork(tasks) {
      document.body.style.cursor = "progress";
      for (const task of tasks.tasks) {
        const param = {
          action: 'submit',
          date: tasks.date,
          projectCode: task.projectCode,
          processCode: task.processCode,
          hour: task.hour
        };
        const exists = CHIPS.some(item =>
          item.projectCode === task.projectCode &&
          item.processCode === task.processCode &&
          item.hour === task.hour
        );
        if (!exists) {
          CHIPS.push(task);
        }
        console.log('●param', param);
        const res = await window.api.submitWork(param);
      }
      console.log('●CHIPS', CHIPS);
      displayChips();
      await window.api.set(PROJECT_CHIPS_KEY, CHIPS);
      for (const dateButton of dateButtons) {
        if (dateButton.classList.contains('date_btn_selected')) {
          dateButton.classList.remove('date_btn_selected');
          dateButton.classList.add('date_btn_disabled');
          break;
        }
      }
      selectedDate = null;
      document.body.style.cursor = "default";
      alert('登録完了');
    }
    submitWork(tasks);
  }
  const editSettings = async () => {
    await window.api.submitWork({ action: 'editSettings' });

  }

</script>
